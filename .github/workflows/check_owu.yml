name: Synchronizacja OWU

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: owu-sync
  cancel-in-progress: false

jobs:
  check-owu:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Uruchom weryfikację
        env:
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          PYTHONUNBUFFERED: "1"
        run: python -u check_owu.py

      - name: Zapisz stan hashy i panelu w repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "OWU Sync Bot"
          git add hashes.json index.html
          if ! git diff --staged --quiet; then
            git commit -m "Aktualizacja hashy OWU i panelu dashboard [skip ci]"
            for i in {1..3}; do
              git pull --rebase -X theirs origin main && git push origin main && break || sleep 5
            done
          fi
