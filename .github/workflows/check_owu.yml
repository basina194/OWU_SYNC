name: Synchronizacja OWU

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-owu:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Uruchom weryfikację
        env:
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          PYTHONUNBUFFERED: "1"
        run: python -u check_owu.py

      - name: Zapisz stan hashy i panelu w repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "OWU Sync Bot"
          git add hashes.json index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizacja hashy OWU i panelu dashboard [skip ci]" && git push)

